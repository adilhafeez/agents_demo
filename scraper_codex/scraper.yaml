name: web-summarizer-codex
agent: codex
env:
  HARNESS_INFERENCE_MODEL: kimi-k3
secrets:
  HARNESS_INFERENCE_API_KEY: ${MODEL_ACCESS_KEY}
permissions:
  default: allow
skills:
  - name: web-summarizer
    description: Use when asked to visit, read or summarize a website.
    instructions: |
      Browse with the preinstalled headless Chromium, set up as the
      `headless-browser` skill describes; do not download another browser.

      Write one reusable script that takes URLs as arguments and prints, for
      each, the title and the visible text of `main` (or `body`), capped at about
      5000 characters. Launch with `chromium.launch({ args: ["--no-sandbox"] })`.

      - Read the start page (with its links) first, then fetch every page you
        need in one run of the script. At most 3 browse commands.
      - Use that output for the summary; do not re-open pages or grep saved text.
      - Never submit a form or enter credentials. If a page blocks you, say so and move on.

      Write the summary to `/workspace/artifacts/summary.md` and reply with the
      same Markdown: a title, a two-sentence TL;DR, 3 to 7 key points, and the
      source URLs. Use only what appeared on the pages.
